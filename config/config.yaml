http:
  addr: ":8080"
queue:
  protocol: constant
  capacity: 1000
  query: "SELECT id, val, score FROM flood_data ORDER BY RAND() LIMIT 100"
kafka:
  brokers:
    - "localhost:9092"
  topic: "messages"
  partition: 0
  group_id: "gaardrail"
target:
  protocol: sql
  driver: mysql
  dsn: "root:root@tcp(localhost:3306)/gaardrail"
  tls:
    enabled: false
    skip_verify: false
    ca_file: ""
    server_name: ""
metrics_poller:
  enabled: true
  interval_ms: 5000
  protocol: prometheusapi
  endpoint: "http://localhost:9090/api/v1/query"
  mappings:
    'irate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service="mysql"}[15s])*100': cpu
controller:
  type: "pidff"
orchestrator:
  rate: 0
  workers: 1
  burst: 5
pid:
  setpoint: 50
  kp: 0.058
  ki: 0.009
  kd: 0
  min: 0
  max: 50
  i_clamp: 40
  ff_gain: 2.389
  setpoint_filter_tau: 10
smith:
  setpoint: 50.0
  kp: 0.042283
  ki: 0.00781074
  min: 0.0
  max: 40
  i_clamp: 40
  model_k: 2.47465
  model_tau: 33.1391
  model_theta: 61.74
  sample_seconds: 5.0
