<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gaardrail</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #57606a;
      --text-faint: #6e7781;
      --accent: #0969da;
      --success: #1a7f37;
      --success-hover: #1f883d;
      --error: #cf222e;
      --error-hover: #a40e26;
      --backdrop: #1f2328aa;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-faint: #6e7681;
      --accent: #58a6ff;
      --success: #238636;
      --success-hover: #2ea043;
      --error: #da3633;
      --error-hover: #f85149;
      --backdrop: #0d1117aa;
    }

    body {
      font-family: monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      color: var(--accent);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .divider { color: var(--border); }

    #gear, #theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      padding: 5px 9px;
    }
    #gear:hover, #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    #summary {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    #summary .k { color: var(--text-faint); }
    #summary .v { color: var(--text); }
    #summary .type {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button {
      font-family: monospace;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 12px;
    }

    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }
    select:disabled { opacity: 0.5; cursor: default; }

    #drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      z-index: 90;
    }
    #drawer-backdrop.open { display: block; }

    #drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 270px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.2s ease, border-color 0.3s;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #drawer.open { transform: translateX(0); }
    #drawer.editing { border-right-color: var(--accent); }
    #drawer.success { border-right-color: var(--success); }
    #drawer.error   { border-right-color: var(--error); }

    #drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #drawer-head .brand { font-size: 13px; }
    #drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 0 4px;
    }
    #drawer-close:hover { color: var(--text); }

    .section { display: flex; flex-direction: column; gap: 8px; }
    .section > .label {
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .section.divided { border-top: 1px solid var(--border); padding-top: 16px; }

    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pfield { display: flex; flex-direction: column; gap: 2px; }
    .pfield label {
      color: var(--text-faint);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pfield input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 4px 6px;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
      width: 100%;
      outline: none;
    }
    .pfield input:focus { border-color: var(--accent); }

    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label {
      color: var(--text-faint);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 7px;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }

    .row { display: flex; gap: 8px; align-items: center; }

    .btn-save {
      background: var(--success);
      border: none;
      color: #fff;
      flex: 1;
    }
    .btn-save:hover { background: var(--success-hover); }
    .btn-save:disabled { opacity: 0.5; cursor: default; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { color: var(--text); }

    .btn-flood {
      background: var(--error);
      border: none;
      color: #fff;
      width: 100%;
    }
    .btn-flood:hover { background: var(--error-hover); }
    .btn-flood:disabled { opacity: 0.5; cursor: default; }

    .msg { font-size: 11px; min-height: 14px; }

    #grafana { flex: 1; overflow: hidden; }
    #grafana iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="brand">GAARDRAIL</span>
    <span class="divider">|</span>
    <button id="gear" onclick="toggleDrawer()" title="configuração">⚙</button>
    <button id="theme-toggle" onclick="toggleTheme()" title="tema">🌙</button>
    <span class="divider">|</span>
    <div id="summary"></div>
  </div>

  <div id="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside id="drawer">
    <div id="drawer-head">
      <span class="brand">CONFIGURAÇÃO</span>
      <button id="drawer-close" onclick="closeDrawer()" title="fechar">✕</button>
    </div>

    <div class="section">
      <div class="label">Controlador</div>
      <select id="ctype" onchange="switchController(this.value)">
        <option value="pid">pid</option>
        <option value="pidff">pid + feedforward</option>
        <option value="step">step</option>
        <option value="smith">smith</option>
      </select>
      <div id="ctrl-active" class="summary" style="margin-top:6px"></div>
    </div>

    <div class="section divided">
      <div class="label">Aquisição (polling)</div>
      <div id="poll-info" data-interval="{{POLL_INTERVAL_MS}}" data-query="{{POLL_QUERY}}"></div>
    </div>

    <div class="section divided">
      <div class="label">Parâmetros</div>
      <div id="params"></div>
      <div class="row">
        <button class="btn-save" onclick="saveParams()">✓ Salvar</button>
        <button class="btn-ghost" onclick="loadParams()" title="recarregar">↺</button>
      </div>
      <span id="param-msg" class="msg"></span>
    </div>

    <div class="section divided">
      <div class="label">Filtro de setpoint</div>
      <div class="field">
        <label>tipo</label>
        <select id="sf-type"></select>
      </div>
      <div class="field">
        <label>tamanho (amostras)</label>
        <input type="number" id="sf-size" min="1" step="1" value="1">
      </div>
      <div class="row">
        <button class="btn-save" id="sf-apply" onclick="applyFilter()">✓ aplicar</button>
      </div>
      <span id="sf-msg" class="msg"></span>
    </div>

    <div class="section divided">
      <div class="label">Fila</div>
      <select id="qtype" onchange="switchQueue(this.value)"></select>
      <div id="queue-config"></div>
    </div>

    <div class="section divided">
      <div class="label">Perturbação</div>
      <div class="field">
        <label>query</label>
        <input type="text" id="dist-query" placeholder="SELECT SLEEP(0.01)">
      </div>
      <div class="field">
        <label>rate (queries/s, 0 = parar)</label>
        <input type="number" id="dist-rate" step="any" min="0" value="0">
      </div>
      <div class="field">
        <label>duração (s, 0 = até parar)</label>
        <input type="number" id="dist-duration" step="any" min="0" value="0">
      </div>
      <div class="row">
        <button class="btn-save" onclick="applyDisturbance()">✓ aplicar</button>
        <button class="btn-ghost" onclick="stopDisturbance()" title="parar">■ parar</button>
      </div>
      <span id="dist-msg" class="msg"></span>
    </div>
  </aside>

  <div id="grafana">
    <iframe src="{{GRAFANA_URL}}" title="Grafana Dashboard"></iframe>
  </div>

  <script>
    const FIELDS = ['setpoint', 'kp', 'ki', 'kd', 'min', 'max', 'i_clamp', 'ff_gain'];
    // Smith is a PI (no derivative) + internal model; the model fields below are
    // read-only (set via config from the identification, shown for insight).
    const SMITH_FIELDS = ['setpoint', 'kp', 'ki', 'min', 'max', 'i_clamp'];
    const SMITH_MODEL = ['model_k', 'model_tau', 'model_theta', 'sample_seconds'];
    const SETPOINT_FILTER_TYPES = ['none', 'moving_average', 'exponential'];
    let current = {};            // controller params from /pid
    let queue = { type: 'inmemory', available: [] };
    let drawerOpen = false;

    // Editable fields per controller type. 'pid' hides ff_gain (pure PI);
    // 'pidff' shows the full set including ff_gain.
    function activeFields() {
      if (current.type === 'step') return ['max'];
      if (current.type === 'smith') return SMITH_FIELDS;
      if (current.type === 'pid') return FIELDS.filter(f => f !== 'ff_gain');
      return FIELDS; // pidff
    }

    function toggleDrawer() { drawerOpen ? closeDrawer() : openDrawer(); }
    function openDrawer() {
      drawerOpen = true;
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer-backdrop').classList.add('open');
    }
    function closeDrawer() {
      drawerOpen = false;
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer-backdrop').classList.remove('open');
    }

    // ---- Controller params ----

    async function loadParams() {
      try {
        const res = await fetch('/pid');
        if (!res.ok) throw new Error(res.statusText);
        current = await res.json();
        if (current.type) document.getElementById('ctype').value = current.type;
        renderParams();
        renderFilter();
        renderSummary();
        document.getElementById('ctrl-active').innerHTML =
          `<span class="k">controlador ativo</span> <span class="type">${current.type || '—'}</span>`;
        setDrawerClass('');
      } catch (_) {
        document.getElementById('params').innerHTML =
          `<span style="color:var(--error);font-size:11px">Erro ao carregar parâmetros</span>`;
      }
    }

    function renderParams() {
      let html =
        `<div class="params-grid">` + activeFields().map(f => `
          <div class="pfield">
            <label>${f}</label>
            <input type="number" step="any" id="input-${f}"
                   value="${current[f] !== undefined ? current[f] : 0}">
          </div>
        `).join('') + `</div>`;

      // Smith: mostra o modelo interno FOPDT (somente leitura).
      if (current.type === 'smith') {
        html += `<div class="label" style="margin-top:10px">Modelo do preditor (somente leitura)</div>`
          + `<div class="params-grid">` + SMITH_MODEL.map(f => `
            <div class="pfield">
              <label>${f}</label>
              <input type="number" step="any" value="${current[f] !== undefined ? current[f] : '—'}" disabled>
            </div>
          `).join('') + `</div>`;
      }
      document.getElementById('params').innerHTML = html;
    }

    function renderSummary() {
      const parts = activeFields()
        .map(f => `<span class="k">${f}</span> <span class="v">${current[f] !== undefined ? current[f] : '—'}</span>`)
        .join(' <span class="k">·</span> ');
      let filterPart = '';
      if (current.type !== 'step' && current.setpoint_filter_type !== undefined) {
        const val = current.setpoint_filter_type === 'none'
          ? 'none'
          : `${current.setpoint_filter_type}·${current.setpoint_filter_size}`;
        filterPart = ` <span class="k">·</span> <span class="k">filtro</span> <span class="v">${val}</span>`;
      }
      document.getElementById('summary').innerHTML =
        `<span class="type">${current.type || '—'}</span> <span class="k">·</span> ` + parts + filterPart;
    }

    async function saveParams() {
      const body = {};
      for (const f of activeFields()) {
        const val = parseFloat(document.getElementById(`input-${f}`).value);
        if (isNaN(val)) continue;
        if (val !== current[f]) body[f] = val;
      }
      if (Object.keys(body).length === 0) return;

      try {
        const res = await fetch('/pid', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          paramFeedback('error', data.error || `Erro ${res.status}`);
          return;
        }
        paramFeedback('success', '✓ salvo');
        setTimeout(loadParams, 1500);
      } catch (_) {
        paramFeedback('error', 'Erro de rede');
      }
    }

    async function switchController(type) {
      try {
        const res = await fetch('/controller/type', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          paramFeedback('error', data.error || `Erro ${res.status}`);
          document.getElementById('ctype').value = current.type || 'pid';
          return;
        }
        loadParams();
      } catch (_) {
        paramFeedback('error', 'Erro de rede');
        document.getElementById('ctype').value = current.type || 'pid';
      }
    }

    function paramFeedback(type, msg) {
      setDrawerClass(type);
      const el = document.getElementById('param-msg');
      el.textContent = msg || '';
      el.style.color = type === 'error' ? 'var(--error)' : 'var(--success)';
      if (msg) setTimeout(() => { el.textContent = ''; }, 3000);
    }

    function setDrawerClass(cls) {
      const d = document.getElementById('drawer');
      d.className = '';
      if (drawerOpen) d.classList.add('open');
      if (cls) d.classList.add(cls);
    }

    // ---- Setpoint filter ----

    function renderFilter() {
      const sel = document.getElementById('sf-type');
      const size = document.getElementById('sf-size');
      const filterType = current.setpoint_filter_type !== undefined ? current.setpoint_filter_type : 'none';
      sel.innerHTML = SETPOINT_FILTER_TYPES
        .map(t => `<option value="${t}"${t === filterType ? ' selected' : ''}>${t}</option>`)
        .join('');
      if (current.setpoint_filter_size !== undefined) size.value = current.setpoint_filter_size;
      // O step é um atuador fixo, sem referência: o filtro não se aplica.
      const off = current.type === 'step';
      sel.disabled = off;
      size.disabled = off;
      document.getElementById('sf-apply').disabled = off;
    }

    async function applyFilter() {
      const type = document.getElementById('sf-type').value;
      const size = parseInt(document.getElementById('sf-size').value, 10);
      if (isNaN(size) || size < 1) { sfMsg('tamanho: inteiro ≥ 1', 'var(--error)'); return; }

      const body = {};
      if (type !== current.setpoint_filter_type) body.setpoint_filter_type = type;
      if (size !== current.setpoint_filter_size) body.setpoint_filter_size = size;
      if (Object.keys(body).length === 0) return;

      try {
        const res = await fetch('/pid', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          sfMsg(data.error || `Erro ${res.status}`, 'var(--error)');
          return;
        }
        sfMsg('✓ aplicado', 'var(--success)');
        setTimeout(loadParams, 1500);
      } catch (_) {
        sfMsg('Erro de rede', 'var(--error)');
      }
    }

    function sfMsg(msg, color) {
      const el = document.getElementById('sf-msg');
      if (!el) return;
      el.textContent = msg;
      el.style.color = color;
      if (msg) setTimeout(() => { el.textContent = ''; }, 3000);
    }

    // ---- Queue ----

    async function loadQueue() {
      try {
        const res = await fetch('/queue/type');
        if (!res.ok) throw new Error(res.statusText);
        queue = await res.json();
        queue.available = queue.available || [];
        renderQueueSelect();
        renderQueueConfig();
      } catch (_) {
        document.getElementById('queue-config').innerHTML =
          `<span style="color:var(--error);font-size:11px">Erro ao carregar fila</span>`;
      }
    }

    function renderQueueSelect() {
      const sel = document.getElementById('qtype');
      const options = queue.available.length ? queue.available : [queue.type];
      sel.innerHTML = options
        .map(t => `<option value="${t}">${t}</option>`)
        .join('');
      sel.value = queue.type;
      // Non-switchable queues (kafka/sqs) report no alternatives.
      sel.disabled = queue.available.length === 0;
    }

    function renderQueueConfig() {
      const el = document.getElementById('queue-config');
      if (queue.type === 'constant') {
        el.innerHTML = `
          <div class="field" style="margin-top:8px">
            <label>query constante</label>
            <input type="text" id="const-query" placeholder="SELECT ...">
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn-save" onclick="applyQuery()">✓ aplicar query</button>
          </div>
          <span id="queue-msg" class="msg"></span>`;
        loadQuery();
      } else {
        el.innerHTML = `
          <div class="field" style="margin-top:8px">
            <label>query (payload)</label>
            <input type="text" id="flood-payload"
                   value="SELECT id, val, score FROM flood_data ORDER BY RAND() LIMIT 100">
          </div>
          <div class="field" style="margin-top:8px">
            <label>quantidade (max 10 000)</label>
            <input type="number" id="flood-qty" value="1000" min="1" max="10000">
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn-flood" id="btn-flood" onclick="sendFlood()">▶ flood</button>
          </div>
          <span id="queue-msg" class="msg"></span>`;
      }
    }

    async function switchQueue(type) {
      try {
        const res = await fetch('/queue/type', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          queueMsg(data.error || `Erro ${res.status}`, 'var(--error)');
          document.getElementById('qtype').value = queue.type;
          return;
        }
        loadQueue();
      } catch (_) {
        queueMsg('Erro de rede', 'var(--error)');
        document.getElementById('qtype').value = queue.type;
      }
    }

    // ---- Constant query ----

    async function loadQuery() {
      try {
        const res = await fetch('/queue/query');
        if (!res.ok) return;
        const data = await res.json();
        const input = document.getElementById('const-query');
        if (input && data.query) input.value = data.query;
      } catch (_) {}
    }

    async function applyQuery() {
      const query = document.getElementById('const-query').value;
      if (!query) { queueMsg('query obrigatória', 'var(--error)'); return; }
      try {
        const res = await fetch('/queue/query', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          queueMsg(data.error || `Erro ${res.status}`, 'var(--error)');
          return;
        }
        queueMsg('✓ aplicada', 'var(--success)');
      } catch (_) {
        queueMsg('Erro de rede', 'var(--error)');
      }
    }

    // ---- Flood ----

    async function sendFlood() {
      const payload = document.getElementById('flood-payload').value;
      const qty = parseInt(document.getElementById('flood-qty').value, 10);

      if (!payload) { queueMsg('payload obrigatório', 'var(--error)'); return; }
      if (isNaN(qty) || qty < 1 || qty > 10000) { queueMsg('quantidade: 1–10000', 'var(--error)'); return; }

      setFloodLoading(true);
      try {
        const res = await fetch(`/messages/flood?quantity=${qty}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          queueMsg(data.error || `Erro ${res.status}`, 'var(--error)');
          setFloodLoading(false);
          return;
        }
        queueMsg(`✓ queued: ${data.queued}`, 'var(--success)');
        setFloodLoading(false);
      } catch (_) {
        queueMsg('Erro de rede', 'var(--error)');
        setFloodLoading(false);
      }
    }

    function setFloodLoading(loading) {
      const btn = document.getElementById('btn-flood');
      if (!btn) return;
      btn.disabled = loading;
      btn.textContent = loading ? 'sending...' : '▶ flood';
      const p = document.getElementById('flood-payload');
      const q = document.getElementById('flood-qty');
      if (p) p.disabled = loading;
      if (q) q.disabled = loading;
    }

    function queueMsg(msg, color) {
      const el = document.getElementById('queue-msg');
      if (!el) return;
      el.textContent = msg;
      el.style.color = color;
    }

    // ---- Disturbance ----

    async function loadDisturbance() {
      try {
        const res = await fetch('/disturbance');
        if (!res.ok) return;
        const data = await res.json();
        if (data.query) document.getElementById('dist-query').value = data.query;
        document.getElementById('dist-rate').value = data.rate || 0;
        document.getElementById('dist-duration').value = data.duration_seconds || 0;
      } catch (_) {}
    }

    async function postDisturbance(body) {
      try {
        const res = await fetch('/disturbance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          distMsg(data.error || `Erro ${res.status}`, 'var(--error)');
          return false;
        }
        return true;
      } catch (_) {
        distMsg('Erro de rede', 'var(--error)');
        return false;
      }
    }

    async function applyDisturbance() {
      const query = document.getElementById('dist-query').value;
      const rate = parseFloat(document.getElementById('dist-rate').value);
      const duration = parseFloat(document.getElementById('dist-duration').value);
      if (!query) { distMsg('query obrigatória', 'var(--error)'); return; }
      if (isNaN(rate) || rate < 0) { distMsg('rate inválido', 'var(--error)'); return; }

      const ok = await postDisturbance({
        query,
        rate,
        duration_seconds: isNaN(duration) ? 0 : duration,
      });
      if (ok) distMsg(rate > 0 ? '✓ aplicada' : '✓ parada', 'var(--success)');
    }

    async function stopDisturbance() {
      // rate 0 stops the disturbance; query is still required by the API.
      const query = document.getElementById('dist-query').value || 'SELECT 1';
      const ok = await postDisturbance({ query, rate: 0, duration_seconds: 0 });
      if (ok) {
        document.getElementById('dist-rate').value = 0;
        distMsg('✓ parada', 'var(--success)');
      }
    }

    function distMsg(msg, color) {
      const el = document.getElementById('dist-msg');
      if (!el) return;
      el.textContent = msg;
      el.style.color = color;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDrawer();
      if (e.key === 'Enter' && drawerOpen && e.target.id && e.target.id.startsWith('input-')) saveParams();
      if (e.key === 'Enter' && drawerOpen && e.target.id === 'sf-size') applyFilter();
    });

    function renderPoll() {
      const el = document.getElementById('poll-info');
      if (!el) return;
      const ms = parseInt(el.dataset.interval, 10);
      const q = el.dataset.query || '';
      const human = isNaN(ms) ? '—' : (ms >= 1000 ? `${ms} ms (${ms / 1000} s)` : `${ms} ms`);
      el.innerHTML =
        `<div class="summary"><span class="k">intervalo</span> <span class="v">${human}</span></div>`
        + (q ? `<div class="pfield" style="margin-top:6px"><label>query da medição (CPU)</label>`
             + `<input type="text" value="${q.replace(/"/g, '&quot;')}" disabled></div>` : '');
    }

    // ---- Theme ----

    function toggleTheme() {
      const dark = document.documentElement.dataset.theme === 'dark';
      setTheme(dark ? 'light' : 'dark');
    }

    function setTheme(theme) {
      if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
      localStorage.setItem('theme', theme);
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀' : '🌙';
      syncGrafanaTheme(theme);
    }

    function syncGrafanaTheme(theme) {
      const iframe = document.querySelector('#grafana iframe');
      if (!iframe) return;
      const src = iframe.src;
      const next = /[?&]theme=/.test(src)
        ? src.replace(/([?&])theme=[^&]*/, '$1theme=' + theme)
        : src + (src.includes('?') ? '&' : '?') + 'theme=' + theme;
      if (next !== src) iframe.src = next;
    }

    function initTheme() {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀' : '🌙';
      syncGrafanaTheme(theme);
    }

    initTheme();
    renderPoll();
    loadParams();
    loadQueue();
    loadDisturbance();
  </script>
</body>
</html>
